name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - README.md
      - .vscodeignore
      - src/**
      - media/**
      - scripts/**
      - tsconfig.json
      - tsup.config.ts
      - .github/workflows/openvsx-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Package VSIX
        run: npm run package

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: notewise-editor-vsix
          path: "*.vsix"
          if-no-files-found: error

      # GitHub Release is the primary distribution channel: open-vsx.org returns 503
      # intermittently for this extension, so we cannot rely on it. This step always
      # runs and attaches the VSIX to a tag named after package.json's version.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: NoteWise Editor ${{ steps.version.outputs.value }}
          files: "*.vsix"
          fail_on_unmatched_files: true

      # Open VSX is best-effort. A 503 (or missing token) must not fail the workflow,
      # because the GitHub Release above already distributes the build.
      - name: Publish to Open VSX (best effort)
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::Missing OVSX_PAT secret; skipping Open VSX publish (GitHub Release already published)."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.value }}"
          version_exists() {
            node -e "fetch('https://open-vsx.org/api/rockuen/notewise-editor/' + process.argv[1]).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" "$VERSION"
          }
          if version_exists; then
            echo "Open VSX already has rockuen.notewise-editor v${VERSION}; nothing to do."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            echo "Open VSX publish attempt ${attempt}/5"
            if npx ovsx -p "$OVSX_PAT" publish *.vsix --skip-duplicate; then
              exit 0
            fi
            if version_exists; then
              echo "Open VSX now has v${VERSION}; treating as success."
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "::warning::Open VSX publish failed (likely 503); GitHub Release remains the distribution channel."
          exit 0
